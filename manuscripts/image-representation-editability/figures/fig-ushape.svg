<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330" font-family="Helvetica, Arial, sans-serif">
  <!-- Axis arrowheads are explicit polygons (not SVG markers) so the svglib/ReportLab PDF shows them.
       Font sizes are 0.75 of the original design values: the published PDF (older svglib)
       drew text at that scale, and svglib 2.2 honours the declared size. -->
  <defs>
    <style>
      .ax{stroke:#4a5568;stroke-width:1.3;fill:none;}
      .axl{fill:#2d3748;font-size:9px;} .u{fill:none;stroke:#2b6cb0;stroke-width:2.6;}
      .fam{fill:#1a202c;font-size:7.5px;text-anchor:middle;} .pole{fill:#2f855a;font-size:8.25px;font-weight:bold;text-anchor:middle;}
      .lo{fill:#c05621;font-size:8.25px;font-weight:bold;text-anchor:middle;} .dot{fill:#2b6cb0;}
    </style>
  </defs>
  <text x="330" y="24" font-size="9.75" font-weight="bold" fill="#1a202c" text-anchor="middle">Editability is U-shaped across the abstraction spectrum</text>

  <!-- axes -->
  <path class="ax" d="M60,270 L611,270"/><polygon fill="#4a5568" points="620,270 611,266 611,274"/>
  <path class="ax" d="M60,270 L60,69"/><polygon fill="#4a5568" points="60,60 56,69 64,69"/>
  <text class="axl" x="330" y="298" text-anchor="middle">abstraction of the representation</text>
  <text class="axl" x="24" y="165" transform="rotate(-90 24 165)" text-anchor="middle">editability (stable + meaningful)</text>

  <!-- U curve: high left, dip middle, high right -->
  <path class="u" d="M75,95 C130,120 175,215 250,235 C320,252 360,252 430,235 C505,215 550,120 605,95"/>

  <!-- pole labels -->
  <text class="pole" x="120" y="78">designed-structure pole</text>
  <text class="pole" x="560" y="78">learned-manifold pole</text>
  <!-- inside the valley it names (it previously sat on the x-axis line) -->
  <text class="lo" x="340" y="212">entangled middle (collapses to noise)</text>

  <!-- family dots + labels; labels are placed clear of the U curve and of the axes -->
  <circle class="dot" cx="88" cy="103" r="4"/><text class="fam" x="84" y="120">primitives</text>
  <circle class="dot" cx="150" cy="150" r="4"/><text class="fam" x="160" y="140">sparse atoms</text>
  <circle class="dot" cx="205" cy="205" r="4"/><text class="fam" x="214" y="196">wavelet / KLT</text>
  <text class="fam" x="172" y="222" fill="#2f855a">locality ~1.0</text>

  <circle class="dot" cx="300" cy="248" r="4"/><text class="fam" x="300" y="263" fill="#c05621">Fourier / DCT</text>
  <text class="fam" x="300" y="233" fill="#c05621">locality 0.16-0.23</text>
  <circle class="dot" cx="365" cy="248" r="4"/><text class="fam" x="372" y="233">neural-field weights</text>
  <circle class="dot" cx="430" cy="235" r="4"/><text class="fam" x="440" y="252">brittle symbolic</text>

  <circle class="dot" cx="560" cy="118" r="4"/><text class="fam" x="515" y="135">generative latent</text>
  <text class="fam" x="552" y="104" fill="#2f855a">disentangled dirs</text>

  <text x="330" y="318" font-size="7.125" fill="#718096" text-anchor="middle">a parameter is stable AND meaningful only when it indexes a low-dimensional manifold with locally disentangled coordinates</text>
</svg>
